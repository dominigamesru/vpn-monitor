<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domini VPN</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/vendor/tippy.css">
<style>
/* Меню у иконки v0.6 (прототип — docs/prototypes/flyout-v06.html): шапка, вид (маршрут / приборная панель / лента),
   низ — учётная запись и иконки. Тема — своя кнопка в шапке (user.json → theme), по умолчанию как в системе. */
:root {
  --bg: #ffffff; --bg-2: #f3f5f8; --ink: #15202e; --muted: #5a6b80; --faint: #8b9bb0; --line: #e2e7ee;
  --accent: #2f5bea; --accent-ink: #ffffff;
  --good: #1f9d55; --warn: #c98a00; --bad: #d6453d; --idle: #8b9bb0;
  --good-bg: #e6f5ec; --warn-bg: #fbf1d9; --bad-bg: #fbe7e5; --idle-bg: #edf0f4;
  --tip-bg: #15202e; --tip-ink: #f3f6fa; --tip-muted: #a9b6c7;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b2430; --bg-2: #232e3b; --ink: #e8eef5; --muted: #93a3b7; --faint: #6f8096; --line: #2c3948;
  --accent: #6f93ff; --accent-ink: #0d131b;
  --good: #3cc274; --warn: #e8b23a; --bad: #f0675e; --idle: #7d8ca0;
  --good-bg: #163323; --warn-bg: #3a2e10; --bad-bg: #3d1b19; --idle-bg: #263140;
  --tip-bg: #0d131b; --tip-ink: #e8eef5; --tip-muted: #8d9db2; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1b2430; --bg-2: #232e3b; --ink: #e8eef5; --muted: #93a3b7; --faint: #6f8096; --line: #2c3948;
  --accent: #6f93ff; --accent-ink: #0d131b;
  --good: #3cc274; --warn: #e8b23a; --bad: #f0675e; --idle: #7d8ca0;
  --good-bg: #163323; --warn-bg: #3a2e10; --bad-bg: #3d1b19; --idle-bg: #263140;
  --tip-bg: #0d131b; --tip-ink: #e8eef5; --tip-muted: #8d9db2; color-scheme: dark }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); font-feature-settings: "tnum" 1; overflow: hidden; user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.d-good { background: var(--good); } .d-warn { background: var(--warn); } .d-bad { background: var(--bad); } .d-idle { background: var(--idle); }
.bg-good { background: var(--good-bg); color: var(--good); } .bg-warn { background: var(--warn-bg); color: var(--warn); }
.bg-bad { background: var(--bad-bg); color: var(--bad); } .bg-idle { background: var(--idle-bg); color: var(--idle); }
.c-good { color: var(--good); } .c-warn { color: var(--warn); } .c-bad { color: var(--bad); } .c-idle { color: var(--idle); }
.mut { color: var(--muted); }

/* шапка */
.hd { display: flex; align-items: center; gap: 6px; padding: 10px 10px 0 16px; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.hd b { color: var(--ink); font-size: 13.5px; font-weight: 600; }
.hd .lnk { cursor: pointer; border-bottom: 1px dotted var(--faint); }
.hd .beta { font-size: 10.5px; padding: 0 5px; border-radius: 4px; background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.hd .sp { flex: 1; }
.ib { width: 30px; height: 30px; border-radius: 8px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; flex: none; }
.ib:hover { background: var(--bg-2); color: var(--ink); }
.ib.on { color: var(--accent); }
.ib svg { width: 18px; height: 18px; }

#root { padding: 10px 16px 0; display: grid; gap: 12px; }
#root[hidden] { display: none; }
.verdict { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.idx { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 19px; font-weight: 700; }
.verdict h3 { margin: 0; font-size: 15.5px; line-height: 1.25; font-weight: 650; text-wrap: balance; }
.verdict .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.note { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.note.advice { color: var(--ink); background: var(--bg-2); border-radius: 8px; padding: 6px 9px; font-size: 12px; }
.note button { border: 0; background: none; color: var(--accent); padding: 0; font-weight: 600; }
.svc { display: flex; flex-wrap: wrap; gap: 4px; }
.svc > span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 1px 7px; border-radius: 6px; background: var(--bg-2); }
.svc small { color: var(--muted); font-size: 10.5px; }

/* маршрут */
.route { display: grid; }
.hop { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; padding: 6px 0; position: relative; }
.hop::before { content: ""; position: absolute; left: 8px; top: 22px; bottom: -8px; width: 2px; background: var(--rail, var(--line)); }
.hop:last-child::before { display: none; }
.hop .pin { width: 14px; height: 14px; border-radius: 50%; border: 3px solid currentColor; margin-top: 3px; background: var(--bg); }
.hop.cause .pin { background: currentColor; box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 20%, transparent); }
.hop .nm { font-weight: 600; font-size: 13.5px; }
.hop .ds { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
.hop .tag { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 4px; margin-left: 6px; }
.hop .v { text-align: right; font-weight: 650; font-size: 13.5px; white-space: nowrap; }
.hop .v small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }

/* приборная панель */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--bg-2); border-radius: 10px; padding: 9px 10px 8px; display: grid; gap: 2px; min-width: 0; }
.tile.wide { grid-column: 1 / -1; }
.tile .k { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tile .val { font-size: 18px; font-weight: 700; line-height: 1.15; }
.tile .val small { font-size: 12px; font-weight: 500; color: var(--muted); }
.tile .nb { font-size: 11.5px; color: var(--muted); }
.gauge { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 8%, transparent); position: relative; margin: 5px 0 3px; }
.gauge i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
.gauge b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .5; }
.gauge b.norm { opacity: .22; width: 3px; }

/* лента часа */
.strips { display: grid; gap: 7px; }
.strip { display: grid; grid-template-columns: 62px 1fr 84px; gap: 8px; align-items: center; font-size: 12.5px; }
.strip .cells { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; height: 16px; }
.strip .cells i { border-radius: 2px; opacity: .85; }
.strip .n { text-align: right; font-weight: 650; white-space: nowrap; }
.axis { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--faint); margin: 0 92px 0 70px; }

/* низ */
/* низ: под разделителем — строка уведомлений фиксированной высоты (текст появляется, ничего не скачет), под ней — учётная запись и иконки */
.bottom { border-top: 1px solid var(--line); }
.ft { display: flex; align-items: center; gap: 2px; padding: 2px 10px 8px 14px; }
.user { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; background: none; border: 0; padding: 6px 8px; margin-left: -8px; border-radius: 8px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user:hover { background: var(--bg-2); }
.ft .sp { flex: 1; }
/* строка уведомлений — над разделителем, место под неё есть всегда: текст появляется, ничего не сдвигается */
.toast { font-size: 11.5px; line-height: 16px; height: 16px; color: var(--muted); padding: 8px 16px 4px; box-sizing: content-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* панель «Пауза» — поверх содержимого над нижней строкой: окно не меняет высоту, ничего не прыгает */
.scrim { position: fixed; inset: 0; background: rgba(13,19,27,.28); }
.scrim[hidden] { display: none; }
.pop { position: fixed; left: 12px; right: 12px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); box-shadow: 0 12px 32px rgba(0,0,0,.22); max-height: calc(100vh - 80px); overflow: auto; }
.pop[hidden] { display: none; }
/* v0.9: значок сети у «Интернета», плашки контекста, сообщения админов */
.nico { display: inline-grid; place-items: center; width: 18px; height: 18px; margin-left: 4px; color: var(--muted); vertical-align: -3px; cursor: help; }
.nico svg { width: 15px; height: 15px; } .nico.warn { color: var(--warn); }
.ctx { display: flex; flex-wrap: wrap; gap: 6px; }
.cx { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 8px 3px 6px; border-radius: 7px; background: var(--bg-2); color: var(--muted); cursor: help; }
.cx svg { width: 14px; height: 14px; } .cx.warn { color: var(--warn); background: var(--warn-bg); } .cx.bad { color: var(--bad); background: var(--bad-bg); }
.ann { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; padding: 9px 6px 9px 12px; border-radius: 10px; background: var(--bg-2); border-left: 4px solid var(--accent); font-size: 12.5px; }
.ann.warn { border-left-color: var(--warn); background: var(--warn-bg); } .ann.outage { border-left-color: var(--bad); background: var(--bad-bg); } .ann.resolved { border-left-color: var(--good); background: var(--good-bg); }
.ann b { font-size: 13px; } .ann p { margin: 2px 0 0; } .ann a { color: var(--accent); font-size: 12px; }
.ann .x { width: 24px; height: 24px; border: 0; background: none; color: var(--muted); border-radius: 6px; display: grid; place-items: center; padding: 0; }
.ann .x:hover { color: var(--ink); background: rgba(0,0,0,.06); } .ann .x svg { width: 14px; height: 14px; }
.sigbar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; margin: 2px 0 4px; } .sigbar i { display: block; height: 100%; }
.menu .head { display: flex; align-items: flex-start; gap: 8px; padding: 6px 4px 4px 10px; }
.menu .head div { flex: 1; }
.menu .head b { display: block; font-size: 13px; }
.menu .head span { display: block; font-size: 11.5px; color: var(--muted); }
.menu .head .ib { width: 26px; height: 26px; padding: 0; justify-content: center; }
/* время в шапке во время проверки — мерцает и не нажимается; ширина не меняется (шапка не уезжает) */
.lnk.busy { pointer-events: none; animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
.ib.busy svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.menu { display: grid; }
.menu button { border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 6px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.menu button:hover, .menu button:focus-visible { background: var(--bg); }
.menu .lbl { padding: 6px 10px 2px; font-size: 11.5px; color: var(--muted); }

/* подсказки (Tippy) */
.tippy-box[data-theme~="vpn"] { background: var(--tip-bg); color: var(--tip-ink); border-radius: 10px; font-size: 12.5px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.tippy-box[data-theme~="vpn"] > .tippy-arrow { color: var(--tip-bg); }
.tippy-box[data-theme~="vpn"] .tippy-content { padding: 10px 12px; }
.tip { display: grid; gap: 5px; max-width: 290px; }
.tip .big { font-weight: 650; font-size: 13px; }
.tip .tm { color: var(--tip-muted); }
.tip .kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; }
.tip .kv span:nth-child(even) { text-align: right; font-weight: 600; }
.tip .row { display: flex; align-items: center; gap: 6px; }
.tip svg { display: block; }
.err { display: grid; gap: 4px; padding: 4px 0 2px; }
.err span { color: var(--muted); font-size: 12.5px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

    strip("Интернет", inetCells, r ? mbps(r.inet.value) : "—", tipInet),

}
function notes() {
  const out = [], sn = S?.snapshot;
  if (!S?.login && (sn?.targets || []).some((t) => t.note)) out.push(h("div", { class: "note" }, "Войдите с учётной записью AD, чтобы проверять Jira, Confluence и SVN", h("button", { type: "button", text: "Войти", onclick: () => toApp("open:settings") })));
  if (sn?.lite) out.push(h("div", { class: "note", text: `${sn.lite[0].toUpperCase()}${sn.lite.slice(1)} — проверяю без скачивания` }));
  // совет по известной причине (v0.7) — что сделать самому до обращения в поддержку
  if (!S?.paused && outage()) out.push(h("div", { class: "note advice", text: "Звонить в поддержку не нужно — админы знают и чинят." }));
  else if (!S?.paused && sn?.advice?.length) out.push(h("div", { class: "note advice", text: `Совет: ${sn.advice[0]}` }));
  const c = ctxRow(); if (c) out.push(c);
  return out;
}

// ---------- шапка и низ ----------
const THEMES = [["", "как в системе", "auto"], ["light", "светлая", "sun"], ["dark", "тёмная", "moon"]];
function applyTheme() { const t = S?.prefs?.theme || ""; if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
function toast(text, keep) { const t = $("#toast"); t.textContent = text; clearTimeout(toast.t); if (!keep) toast.t = setTimeout(() => { t.textContent = ""; }, 3500); }
async function checkUpdates() {
  toast("Проверяю обновления…", true);
  try { const r = await api("/api/update", { method: "POST", body: "{}" });
    if (r.error) toast(`Не проверить: ${r.error}`);
    else if (r.available) toast(`Доступна ${r.latest} — поставится сама в ближайшие минуты`);
    else toast(`У вас последняя версия ${r.current}${r.channel === "beta" ? " (бета)" : ""}`);
  } catch { toast("Приложение не ответило"); }
}
async function checkNow() { toast("Проверяю VPN…"); await api("/api/check", { method: "POST", body: "{}" }); setTimeout(refresh, 400); }
function header() {
  const sn = S?.snapshot, beta = S?.prefs?.channel === "beta" || /-/.test(S?.version || "");
  const ver = tip(h("span", { class: "lnk", role: "button", tabindex: "0", text: `v${(S?.version || "").replace(/-.*/, "")}`, onclick: checkUpdates, onkeydown: (e) => e.key === "Enter" && checkUpdates() }), () =>
    tipBox(h("div", { class: "big", text: `Версия ${S?.version}${beta ? ", канал «Бета»" : ""}` }), kv([["обновлено", day(S?.updated_ms)], S?.latest && S.latest !== S.version ? ["доступна", S.latest] : null]), h("span", { class: "tm", text: "Нажмите — проверить обновления" })));
  const when = sn ? tip(h("span", { class: S?.checking ? "lnk busy" : "lnk", role: "button", tabindex: "0", "aria-busy": S?.checking ? "true" : "false", text: hhmm(sn.at), onclick: checkNow, onkeydown: (e) => e.key === "Enter" && checkNow() }), () =>
    tipBox(h("div", { class: "big", text: `Проверено в ${hms(sn.at)}` }), kv([["вид", sn.full ? "полная, со скачиванием" : sn.lite ? "без скачивания" : "лёгкая"], sn.took_ms ? ["заняла", `${num(sn.took_ms / 1000, 1)} с`] : null]), h("span", { class: "tm", text: "Нажмите — проверить сейчас" }))) : null;
  const ti = Math.max(0, THEMES.findIndex(([k]) => k === (S?.prefs?.theme || "")));
  const themeBtn = h("button", { class: "ib", type: "button", "aria-label": `Тема: ${THEMES[ti][1]}`, title: `Тема: ${THEMES[ti][1]} — нажмите, чтобы сменить`, onclick: async () => { const next = THEMES[(ti + 1) % THEMES.length][0]; S.prefs.theme = next; applyTheme(); render(); await api("/api/prefs", { method: "POST", body: JSON.stringify({ theme: next }) }); } }, icon(THEMES[ti][2]));
  const VIEWS = [["route", "маршрут", "vRoute"], ["dash", "приборная панель", "vDash"], ["strip", "лента часа", "vStrip"]];
  const vi = Math.max(0, VIEWS.findIndex(([k]) => k === view));
  const viewBtn = h("button", { class: "ib", type: "button", "aria-label": `Вид меню: ${VIEWS[vi][1]}`, title: `Вид: ${VIEWS[vi][1]} — нажмите, чтобы сменить`, onclick: async () => { const next = VIEWS[(vi + 1) % VIEWS.length][0]; S.prefs.view = next; render(); await api("/api/prefs", { method: "POST", body: JSON.stringify({ view: next }) }); } }, icon(VIEWS[vi][2]));
  $("#hd").replaceChildren(...[h("b", { text: "Domini VPN" }), S?.city ? h("span", { text: `· ${S.city} ·` }) : h("span", { text: "·" }), ver, beta ? h("span", { class: "beta", text: "бета" }) : null, h("span", { class: "sp" }), when, viewBtn, themeBtn].filter(Boolean));
}
function pauseItems(m) {
  const set = async (body) => { await api("/api/pause", { method: "POST", body: JSON.stringify(body) }); closePop(); refresh(); };
  if (S?.paused) m.append(h("button", { type: "button", onclick: () => set({ resume: true }) }, h("span", { text: "Продолжить проверки" })));
  else m.append(h("div", { class: "head" }, h("div", {}, h("b", { text: "Пауза проверок" }), h("span", { text: "VPN не проверяется, уведомлений нет. Продолжить можно в любой момент." })),
      h("button", { class: "ib", type: "button", "aria-label": "Закрыть без паузы", title: "Закрыть без паузы", onclick: closePop }, icon("close"))), ...[["30 минут", 30], ["1 час", 60], ["До конца дня", 0]].map(([n, v]) => h("button", { type: "button", onclick: () => set({ minutes: v }) }, h("span", { text: n }))));
}
function footer() {
  const r = R(), login = S?.login;
  const ust = !login ? "warn" : r ? r.st_user : "good";
  const user = tip(h("button", { class: "user", type: "button", onclick: () => toApp("open:settings") }, h("span", { class: `dot d-${ust}` }), h("span", { text: login || "Войти" })), () =>
    tipBox(h("div", { class: "big", text: login ? `Учётная запись AD: ${login}` : "Вход не выполнен" }),
      ...office().map((t) => { const bad = (r?.auth_failed || []).includes(t.name); return h("div", { class: "row" }, h("span", { class: `dot d-${bad ? "bad" : t.ok ? "good" : "idle"}` }), h("span", { text: `${t.name} — ${bad ? "вход не принят" : t.ok ? "вход принят" : "не отвечает"}` })); }),
      h("span", { class: "tm", text: "Нажмите — посмотреть расширенный статус" })));
  const ib = (name, label, on, fn) => tip(h("button", { class: `ib${on ? " on" : ""}`, type: "button", "aria-label": label, onclick: fn }, icon(name)), () => tipBox(h("span", { text: label })));
  const pauseLabel = S?.paused ? (() => { const left = Math.max(0, S.prefs.pause_until_ms - Date.now()); const endOfDay = new Date(S.prefs.pause_until_ms).getHours() === 23 && new Date(S.prefs.pause_until_ms).getMinutes() === 59; return endOfDay ? "Пауза до конца дня — до 23:59. Нажмите — продолжить" : `Пауза: ещё ${Math.ceil(left / 60000)} мин, до ${hhmm(S.prefs.pause_until_ms)}. Нажмите — продолжить`; })() : "Пауза проверок: 30 минут, час или до конца дня";
  const pauseBtn = ib(S?.paused ? "play" : "pause", pauseLabel, !!S?.paused, (e) => S?.paused ? api("/api/pause", { method: "POST", body: JSON.stringify({ resume: true }) }).then(refresh) : openPop(e.currentTarget, pauseItems));
  $("#ft").replaceChildren(user, h("span", { class: "sp" }),
    (() => { const b = ib("refresh", S?.checking ? "Проверяю…" : "Проверить сейчас", false, checkNow); if (S?.checking) { b.classList.add("busy"); b.disabled = true; } return b; })(), pauseBtn,
    ib("help", "Поддержка в Jira: отправить запрос со сводкой, диагностикой и логом", false, () => toApp("open:settings/diagnostics")),
    ib("history", "История за сутки и неделю", false, () => toApp("open:history")),
    ib("gear", "Настройки: вид меню, уведомления, обновления, вход", false, () => toApp("open:settings")));
}

// ---------- панель «Пауза» вместо содержимого ----------
let popFor = null;
function closePop() { const a = popFor; popFor = null; $("#pop").hidden = true; $("#scrim").hidden = true; $("#pop").replaceChildren(); if (a && document.body.contains(a)) a.focus(); }
function openPop(anchor, build) {
  if (popFor === anchor) { closePop(); return; }
  closePop(); popFor = anchor;
  const m = h("div", { class: "menu" }); build(m); const pop = $("#pop"); pop.style.bottom = `${document.querySelector(".bottom").offsetHeight + 6}px`;
  pop.replaceChildren(m); pop.hidden = false; $("#scrim").hidden = false;
  m.querySelector("button")?.focus();
}

// ---------- отрисовка ----------
function render() {
  tips.splice(0).forEach((t) => t.destroy());
  applyTheme();
  view = S?.prefs?.view || "route";
  if (view === "gauge" || view === "panel") view = "dash";
  header();
  $("#root").replaceChildren(...({ route: viewRoute, dash: viewDash, strip: viewStrip }[view] || viewRoute)().filter(Boolean));
  footer();
  fit();
}
// Высота окна = высота содержимого (body без высоты), а не scrollHeight: тот не меньше окна, и окно только росло.
let lastH = 0;
function fit() { requestAnimationFrame(() => { const v = Math.ceil(document.body.getBoundingClientRect().height); if (Math.abs(v - lastH) >= 2) { lastH = v; toApp(`h:${v}`); } }); }
let timer = null, fails = 0;
async function refresh() {
  clearTimeout(timer);
  try {
    S = await api("/api/state");
    H = (await api("/api/history?range=hour")).records || [];
    render(); fails = 0;
  } catch (e) {
    fails += 1; report(`данные: ${e.message || e}`);
    if (fails >= 2 || !S) { $("#root").replaceChildren(h("div", { class: "err" }, h("b", { text: "Нет ответа от VPN Monitor" }), h("span", { text: "Пробую снова каждые 5 секунд. Если не проходит — перезапустите приложение." }))); fit(); }
  }
  timer = setTimeout(refresh, S?.checking ? 1000 : 5000);
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (popFor) closePop(); else toApp("hide"); } });
$("#scrim").addEventListener("click", closePop);
window.vpnmon = { shown: () => { closePop(); lastH = 0; refresh(); } };
refresh();
