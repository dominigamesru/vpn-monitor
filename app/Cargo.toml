[package]
name = "vpn-monitor"
version = "0.3.0"
edition = "2024"
description = "Domini VPN Monitor — приложение в трее"
publish = false

[dependencies]
ico = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiny_http = "0.12.0"
ureq = { version = "3.5.0", features = ["platform-verifier"] }

[target."cfg(windows)".dependencies]
tao = "0.37.2"
tray-icon = "0.26.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Time", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security_Credentials"] }
winreg = "0.56.0"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
