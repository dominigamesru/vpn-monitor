# Проверки на каждый пуш и pull request: формат, clippy, тесты (Linux и Windows) и сборка exe.
# Exe каждой сборки — в артефактах прогона (Actions → прогон → Artifacts): так можно тестировать ветку до релиза.
name: ci

on:
  push:
    branches: ["**"]
    paths: ["app/**", ".github/**", "scripts/**", "docs/screens.html"]
  pull_request:
    paths: ["app/**", ".github/**", "scripts/**", "docs/screens.html"]

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Галерея экранов собрана из текущих страниц (python scripts/screens.py)
        working-directory: .
        run: python3 scripts/screens.py --check

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Фавикон dominigames.com (логотип в трее)
        shell: pwsh
        continue-on-error: true
        run: Invoke-WebRequest https://dominigames.com/favicon.ico -OutFile assets/favicon.ico
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Заметки релиза собираются (как в release.yml, в консоли Windows)
        working-directory: .
        shell: python
        run: |
          # шаги release.yml в PR не запускаются — 0.7.1 упал на сборке заметок уже после слияния
          import subprocess, sys, tomllib, urllib.request
          ver = tomllib.load(open("app/Cargo.toml", "rb"))["package"]["version"]
          try:
              prev = urllib.request.urlopen("https://github.com/${{ github.repository }}/releases/download/latest/latest.version", timeout=20).read().decode().strip()
          except Exception:
              prev = ""
          if prev == ver:
              prev = ""
          subprocess.run([sys.executable, "scripts/release_notes.py", "--version", ver, "--prev", prev, "--stdout"], check=True)
      - name: Обновление «последний релиз → эта сборка»
        working-directory: .
        run: python .github/scripts/upgrade_test.py --exe app/target/release/vpn-monitor.exe
      - name: Снимок меню у иконки (WebView2)
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: flyout-screen-${{ github.sha }}
          path: flyout-screen.png
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v5
        with:
          name: vpn-monitor-${{ github.sha }}
          path: app/target/release/vpn-monitor.exe
          retention-days: 14
