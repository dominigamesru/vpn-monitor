# Релиз (ADR 0004): когда в main приходит новая версия в app/Cargo.toml (или вручную / по тегу vX.Y.Z) —
# GitHub Release «Domini VPN Monitor vX.Y.Z»: domini-vpn-monitor.exe, settings.json (с SHA-256 exe), sha256 и
# vpn-monitor.exe (то же exe — для обновлятелей версий до 0.5.4, они знают только это имя), make_latest=false; тег ставит сам релиз.
# Затем latest/latest.version := X.Y.Z — установленные копии обновятся сами за ~5 минут.
# Опубликованный релиз не перезаписывается: если vX.Y.Z уже есть — прогон ничего не делает.
name: release

on:
  push:
    branches: [main]
    paths: ["app/**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: Версия из app/Cargo.toml (и тег, если запуск по тегу)
        id: ver
        shell: python
        run: |
          import os, tomllib
          cargo = tomllib.load(open("app/Cargo.toml", "rb"))["package"]["version"]
          if os.environ["GITHUB_REF_TYPE"] == "tag" and os.environ["GITHUB_REF_NAME"].lstrip("v") != cargo:
              raise SystemExit(f"Тег {os.environ['GITHUB_REF_NAME']} не совпадает с версией {cargo} в app/Cargo.toml")
          # semver: 0.6.0 — стабильная (в оба канала), 0.6.0-beta.1 — бета (только в бета-канал, exe с -beta)
          import re
          if not re.fullmatch(r"\d+\.\d+\.\d+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?", cargo):
              raise SystemExit(f"Версия {cargo} в app/Cargo.toml — не semver (0.6.0 или 0.6.0-beta.1)")
          pre = "-" in cargo
          asset = "domini-vpn-monitor-beta.exe" if pre else "domini-vpn-monitor.exe"
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"version={cargo}\npre={str(pre).lower()}\nasset={asset}\n")

      - name: Релиз v${{ steps.ver.outputs.version }} уже есть?
        id: exists
        shell: bash
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "::notice::Релиз v${{ steps.ver.outputs.version }} уже опубликован — пропускаю. Для нового релиза поднимите version в app/Cargo.toml."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Фавикон dominigames.com (логотип в трее и иконка exe)
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        continue-on-error: true
        run: Invoke-WebRequest https://dominigames.com/favicon.ico -OutFile app/assets/favicon.ico

      - name: Тесты и сборка
        if: steps.exists.outputs.skip != 'true'
        working-directory: app
        run: |
          cargo test
          cargo build --release

      - name: Обновление «последний релиз → эта сборка» (до публикации)
        if: steps.exists.outputs.skip != 'true'
        run: python .github/scripts/upgrade_test.py --exe app/target/release/vpn-monitor.exe
      - name: Снимок меню у иконки (WebView2)
        uses: actions/upload-artifact@v5
        if: always() && steps.exists.outputs.skip != 'true'
        with:
          name: flyout-screen-${{ github.sha }}
          path: flyout-screen.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Файлы релиза
        if: steps.exists.outputs.skip != 'true'
        shell: python
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ASSET: ${{ steps.ver.outputs.asset }}
        run: |
          import hashlib, json, os, pathlib, zlib
          ver = os.environ["VERSION"]
          out = pathlib.Path("dist"); out.mkdir()
          exe = pathlib.Path("app/target/release/vpn-monitor.exe").read_bytes()
          asset = os.environ["ASSET"]
          (out / asset).write_bytes(exe)
          # то же exe под старым именем — его качают обновлятели версий до 0.5.4
          (out / "vpn-monitor.exe").write_bytes(exe)
          settings = json.loads(pathlib.Path("app/config/settings.json").read_text(encoding="utf-8"))
          settings["exe"] = {
              "version": ver,
              "sha256": hashlib.sha256(exe).hexdigest(),
              "crc32": f"{zlib.crc32(exe) & 0xFFFFFFFF:08x}",
              "size": len(exe),
          }
          (out / "settings.json").write_text(json.dumps(settings, ensure_ascii=False, indent=2) + "\n", encoding="utf-8", newline="\n")
          sums = "".join(f"{hashlib.sha256((out / n).read_bytes()).hexdigest()}  {n}\n" for n in (asset, "vpn-monitor.exe", "settings.json"))
          (out / "sha256").write_text(sums, encoding="utf-8", newline="\n")
          (out / "latest.version").write_text(ver + "\n", encoding="utf-8", newline="\n")
          print(sums)

      - name: GitHub Release v${{ steps.ver.outputs.version }}
        if: steps.exists.outputs.skip != 'true'
        shell: bash
        run: |
          tag="v${{ steps.ver.outputs.version }}"
          pre=""; [ "${{ steps.ver.outputs.pre }}" = "true" ] && pre="--prerelease"
          gh release create "$tag" "dist/${{ steps.ver.outputs.asset }}" dist/settings.json dist/sha256 dist/vpn-monitor.exe \
            --target "$GITHUB_SHA" --title "Domini VPN Monitor $tag" --generate-notes --latest=false $pre

      - name: Канал beta := ${{ steps.ver.outputs.version }} (всегда)
        if: steps.exists.outputs.skip != 'true'
        shell: bash
        run: |
          if ! gh release view beta >/dev/null 2>&1; then
            gh release create beta --target "$GITHUB_SHA" --title "Бета-канал" --latest=false \
              --notes "Служебный релиз: latest.version — версия бета-канала (её ставят сотрудники, включившие «Бета»)."
          fi
          gh release upload beta dist/latest.version --clobber
          echo "beta = $(cat dist/latest.version)"

      - name: latest.version := ${{ steps.ver.outputs.version }} (только стабильная)
        if: steps.exists.outputs.skip != 'true' && steps.ver.outputs.pre != 'true'
        shell: bash
        run: |
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --target "$GITHUB_SHA" --title "Последняя версия" \
              --notes "Служебный релиз: latest.version — версия, которую ставят все установленные копии. Сами сборки — в релизах vX.Y.Z. Откат — workflow promote."
          fi
          gh release upload latest dist/latest.version --clobber
          gh release edit latest --latest
          echo "latest.version = $(cat dist/latest.version)"
